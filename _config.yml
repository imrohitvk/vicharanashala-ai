title: Vicharanashala # - Lab for Education Design
description: Innovations that make learning feel human again.
theme: minima

url: "https://vicharanashala.ai"
baseurl: ""

collections:
  projects:
    output: true
    permalink: /projects/:slug/
  initiatives:
    output: true
    permalink: /initiatives/:slug/
  logs:
    output: true
    permalink: /logs/:slug/
  prayoga:
    output: true
    permalink: /logs/vi-prayoga/:slug/

header_pages:
  - pages/ourstory.md
  - pages/products.md
  - pages/lab_initiatives.md
  - pages/national_initiatives.md
  - pages/events.md
  - pages/openings.md
  - pages/vichara_logs.md
  - pages/research_publications.md
  - pages/contact.md
  - pages/team-members.md

linkedin_username: vicharanashala

plugins:
  - jekyll-feed

# Files and folders that are NOT published on the website.
# This list replaces Jekyll's built-in one, so the defaults (Gemfile ... vendor) are listed again.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - CLAUDE.md
  - CLAUDE.local.md
  - LICENSE
  - docs/
