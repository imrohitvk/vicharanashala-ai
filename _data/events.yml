# ── Events shown on the /events/ page ────────────────────────────────────────
# This is the ONLY file you edit to change events. No code needed — edit it in
# the GitHub browser and commit. Each event appears BOTH in the "Upcoming" list
# and on the on-site calendar, placed on its date.
#
# To ADD an event: copy a block below (from "- title:" down to its blurb) and
#   change the values.
# To REMOVE a past event: delete its block.
#
# Fields:
#   title        (required) the event name
#   date         (required) start date as YYYY-MM-DD — places it on the calendar
#   end          (optional) last date as YYYY-MM-DD for a MULTI-DAY event. Omit
#                for a single-day event. The calendar shades all days from date
#                to end; "Upcoming" shows it once (on its start) until end passes.
#   time         (optional) shown as-is, e.g. "8:00 PM IST". Also used to order
#                two events that fall on the SAME day (earliest first).
#   kind         (optional) small badge, e.g. V-Talk / Workshop / FDP / Launch
#   speaker      (optional) speaker name + one-line credential
#   where        (optional) e.g. Online / IIT Ropar
#   register_url (optional) paste the join/registration link. Leave empty ("")
#                and the button simply won't show.
#   blurb        (optional) one line of context
#   image        (optional) path to a poster image, e.g. "/assets/images/events/my-event.jpg".
#                Upload the file under assets/images/events/ first. Currently shown in the
#                CALENDAR POPUP only (not the Upcoming list).

- title: "V-Talk 01 — Entrepreneurial Mindsets for Future Success"
  date: "2026-01-12"
  time: "5:00 PM IST"
  kind: "V-Talk"
  speaker: "Averil Spencer — Founder & CEO, Launch Girls · MBA, MIT | MPA, Harvard"
  where: "Online"
  register_url: "https://zoom.us/meeting/register/grpXsriKRHiVs0lPwxAq6A"
  blurb: "What does it take to build something from nothing — and what does that have to do with how students should be thinking about their education? Averil Spencer, co-founder and CEO of Launch Girls and an alumna of both MIT and Harvard, brought the lived reality of entrepreneurship into the room. Not as a success story to be admired from a distance, but as a mindset — a way of approaching problems, uncertainty, and growth that students can begin practising long before they ever start a company."

- title: "V-Talk 02 — Learn to Learn"
  date: "2026-03-25"
  time: "6:00 PM IST"
  kind: "V-Talk"
  speaker: "Dr. Shyam Vasudha Raghunath Joshi — Ex. Principal, D.B.J. College (A Life Long Learner)"
  where: "Online"
  register_url: "https://forms.gle/D1xWY9hc2nKgkMu87"
  blurb: "Everyone is told to study harder. Far fewer are ever taught how to actually learn. Dr. Shyam Raghunath Joshi turned the spotlight on something students interact with every day but rarely examine: the mechanics of learning itself. From retention to reflection, the session unpacked practical techniques that help learners become more deliberate, more effective, and ultimately more independent — the kind of session that students leave wanting to rethink how they have been approaching their own education entirely."
  image: "/assets/images/events/v-talk-02.jpg"

